name: Vòng Đời Đồi Thị Nâng Chiều (Thalamus HA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *' # Chạy nhịp 4 tiếng để điều hòa đa giác quan

permissions:
  contents: write

jobs:
  run-thalamus:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn Đồi Thị
        uses: actions/checkout@v7

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. DÒ TÌM GIÁC QUAN THEO PHẢ HỆ
      - name: Xúc tu vươn vòi tìm giác quan
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_PARENT: ${{ github.event.repository.parent.owner.login }}
        run: python receptors/cascade_receptor.py

      # 2. ANTEN BẮT SÓNG SỢI NẤM TOÀN CẦU
      - name: Anten quét sóng sợi nấm toàn cầu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python receptors/mesh_receptor.py

      # 3. MÀNG KIỂM DỊCH SHAKE-512 & HÚT NĂNG LƯỢNG HACKER
      - name: Màng kiểm dịch & Thu hoạch dinh dưỡng đối kháng
        run: python receptors/contract_receptor.py

      # 4. ĐỒI THỊ TIÊU HÓA NĂNG LƯỢNG, NÂNG/HẠ CHIỀU & BẮN ĐẠO HÀM
      - name: Vận hành Động cơ Đồi Thị Siêu Chiều
        run: python thalamus_engine.py

      # 5. LƯU VẾT TÍCH VÀO GIT (FAST-FORWARD BẤT TỬ)
      - name: Phát xung đạo hàm hạ chiếu lên môi trường mạng
        run: |
          git config --global user.name "Thalamus-Hyper-Bot"
          git config --global user.email "bot@thalamus.node"
          
          git fetch origin main
          git reset origin/main
          git add synapses/ synapse_backward.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "🏛️ [Đồi Thị Siêu Chiều] Tiêu hóa năng lượng & Hạ chiếu đạo hàm [skip ci]"
            git push origin main
          else
            echo "Không có biến đổi mới."
          fi
